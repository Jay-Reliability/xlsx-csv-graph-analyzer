<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>엑셀/CSV 데이터 Graph Analyzer V1.0</title>
    <!-- SheetJS for .xlsx file support -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #EEF2F6;
            font-family: "Malgun Gothic", "Apple SD Gothic Neo", "NanumGothic", sans-serif;
            font-size: 10pt;
            color: #1F2933;
            overflow: hidden;
        }
        /* Window Title Bar (Mimics PyQt5 Window Header) */
        .app-window {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background-color: #EEF2F6;
        }
        .window-titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, #1E293B 0%, #243B53 100%);
            color: #FFFFFF;
            padding: 6px 14px;
            font-size: 10.5pt;
            font-weight: bold;
            border-bottom: 1px solid #B8C2CC;
            flex-shrink: 0;
        }
        .window-titlebar .title-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .window-titlebar .status-badge {
            font-size: 8.5pt;
            font-weight: normal;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            color: #E2E8F0;
        }

        /* Main Layout (QSplitter Horizontal equivalent) */
        .main-container {
            display: flex;
            flex: 1;
            padding: 8px;
            gap: 0;
            min-height: 0;
            overflow: hidden;
        }

        /* Left Control Panel */
        .left-panel {
            width: 360px;
            min-width: 260px;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            padding: 8px 10px;
            gap: 9px;
            background-color: #EEF2F6;
            height: 100%;
            overflow-y: auto;
            flex-shrink: 0;
        }

        /* Splitter Handles */
        .splitter-v {
            width: 6px;
            cursor: col-resize;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .splitter-v::after {
            content: "";
            width: 2px;
            height: 40px;
            background-color: #CBD5E1;
            border-radius: 1px;
        }
        .splitter-v:hover::after {
            background-color: #2F80ED;
        }

        .splitter-h {
            height: 6px;
            cursor: row-resize;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .splitter-h::after {
            content: "";
            height: 2px;
            width: 40px;
            background-color: #CBD5E1;
            border-radius: 1px;
        }
        .splitter-h:hover::after {
            background-color: #2F80ED;
        }

        /* Right Panel (QSplitter Vertical equivalent) */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            height: 100%;
        }

        .graph-panel {
            flex: 65;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            padding: 6px 8px 4px 8px;
            gap: 8px;
            overflow: hidden;
        }

        .analysis-panel {
            flex: 35;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            padding: 4px 8px 6px 8px;
            overflow: hidden;
        }

        /* QGroupBox Style */
        .group-box {
            position: relative;
            border: 1px solid #B8C2CC;
            border-radius: 8px;
            margin-top: 8px;
            padding: 14px 8px 8px 8px;
            background-color: #F8FAFC;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .group-box-title {
            position: absolute;
            top: -9px;
            left: 10px;
            background-color: #F8FAFC;
            padding: 0 5px;
            font-weight: bold;
            color: #243B53;
            font-size: 9.5pt;
            line-height: 1;
        }

        /* Flex stretches matching PyQt stretch factors */
        .grp-x {
            flex: 1;
            min-height: 85px;
        }
        .grp-y {
            flex: 2;
            min-height: 135px;
        }
        .grp-selected-y {
            flex: 2;
            min-height: 135px;
        }

        /* QPushButton Style */
        .btn {
            background-color: #2F80ED;
            color: #FFFFFF;
            border: none;
            border-radius: 7px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 10pt;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.12s ease;
            flex-shrink: 0;
        }
        .btn:hover {
            background-color: #1C64D1;
        }
        .btn:active {
            background-color: #164E9E;
        }
        .btn-danger {
            background-color: #D92D20;
            padding: 9px 11px;
            font-weight: 700;
        }
        .btn-danger:hover {
            background-color: #B42318;
        }
        .btn-danger:active {
            background-color: #7A271A;
        }

        /* QLabel File Info */
        .lbl-file {
            color: #243B53;
            font-size: 9.5pt;
            word-break: break-all;
            line-height: 1.35;
            padding: 2px 2px;
            flex-shrink: 0;
        }

        /* QListWidget Style */
        .list-widget {
            background-color: #FFFFFF;
            border: 1px solid #BCCCDC;
            border-radius: 6px;
            padding: 4px;
            overflow-y: auto;
            flex: 1;
            min-height: 50px;
            outline: none;
        }
        .list-item {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 9.5pt;
            color: #1F2933;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-item:hover {
            background-color: #EBF8FF;
        }
        .list-item.selected {
            background-color: #BEE3F8;
            color: #102A43;
            font-weight: 600;
        }

        /* QLineEdit Style */
        .line-edit {
            background-color: #FFFFFF;
            border: 1px solid #BCCCDC;
            border-radius: 6px;
            padding: 6px 8px;
            font-family: inherit;
            font-size: 9.5pt;
            color: #1F2933;
            width: 100%;
            user-select: text;
        }
        .line-edit:focus {
            outline: none;
            border-color: #2F80ED;
            box-shadow: 0 0 0 2px rgba(47, 128, 237, 0.15);
        }
        .line-edit::placeholder {
            color: #94A3B8;
        }

        /* Matplotlib Navigation Toolbar Style */
        .mpl-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #F8FAFC;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            padding: 4px 10px;
            flex-shrink: 0;
        }
        .tool-btn {
            background-color: #FFFFFF;
            color: #243B53;
            border: 1px solid #CBD5E1;
            border-radius: 5px;
            padding: 4px 9px;
            font-size: 9pt;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tool-btn:hover {
            background-color: #E2E8F0;
        }
        .tool-btn.active {
            background-color: #BEE3F8;
            border-color: #2F80ED;
            color: #102A43;
        }
        .toolbar-coords {
            margin-left: auto;
            font-family: Consolas, "Courier New", monospace;
            font-size: 9pt;
            color: #475569;
        }

        /* Graph Canvas Container */
        .canvas-container {
            position: relative;
            flex: 1;
            background-color: #FFFFFF;
            border: 1px solid #BCCCDC;
            border-radius: 6px;
            overflow: hidden;
            min-height: 160px;
        }
        #plotCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Graph Control Grid (그래프 확대 범위 및 저장) */
        .graph-control-grid {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr 145px;
            gap: 8px;
            align-items: center;
        }
        .control-label {
            color: #243B53;
            font-size: 9.5pt;
            white-space: nowrap;
            padding: 0 4px;
        }

        /* Analysis QTextEdit Style */
        .analysis-group {
            flex: 1;
            min-height: 0;
        }
        .analysis-text {
            flex: 1;
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            color: #102A43;
            border: 1px solid #BCCCDC;
            border-radius: 6px;
            padding: 8px 10px;
            font-family: Consolas, "Courier New", "Malgun Gothic", monospace;
            font-size: 9.5pt;
            line-height: 1.45;
            white-space: pre;
            overflow: auto;
            resize: none;
            user-select: text;
        }
        .analysis-text:focus {
            outline: none;
        }

        /* Modal Dialog for messages (Mimics QMessageBox) */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-backdrop.show {
            display: flex;
        }
        .modal-box {
            background: #FFFFFF;
            border-radius: 8px;
            width: 420px;
            max-width: 92vw;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border: 1px solid #B8C2CC;
            overflow: hidden;
        }
        .modal-header {
            background: #243B53;
            color: #FFFFFF;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 10pt;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-body {
            padding: 18px 16px;
            color: #1F2933;
            font-size: 9.5pt;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .modal-footer {
            padding: 8px 16px 12px 16px;
            display: flex;
            justify-content: flex-end;
            background: #F8FAFC;
            border-top: 1px solid #E2E8F0;
        }
    </style>
</head>
<body>
<div class="app-window" id="appWindow">
    <!-- Top Window Bar -->
    <div class="window-titlebar">
        <div class="title-text">
            <span>📊 엑셀/CSV 데이터 Graph Analyzer V1.0 ⚡ (Authored by JH Lee)</span>
        </div>
        <div class="status-badge" id="statusBadge">Ready</div>
    </div>

    <!-- Main Horizontal Splitter Layout -->
    <div class="main-container" id="mainContainer">
        <!-- Left Control Panel -->
        <div class="left-panel" id="leftPanel">
            <input type="file" id="fileInput" accept=".csv,.xlsx" style="display: none;" />
            <button class="btn" id="btnLoadCsv" title="로컬 PC의 CSV 또는 XLSX 엑셀 파일을 불러옵니다.">📂 csv/xlsx 파일 로딩</button>
            <div class="lbl-file" id="lblFile">선택된 파일: 없음</div>

            <!-- x축 데이터 선택 -->
            <div class="group-box grp-x">
                <span class="group-box-title">x축 데이터 선택</span>
                <div class="list-widget" id="xList" tabindex="0"></div>
            </div>

            <!-- y축 데이터 선택 - 다중 선택 가능 -->
            <div class="group-box grp-y">
                <span class="group-box-title">y축 데이터 선택 - 다중 선택 가능</span>
                <div class="list-widget" id="yList" tabindex="0"></div>
                <button class="btn" id="btnSelectData">⬇ 데이터 선택</button>
            </div>

            <!-- y축 선택 데이터 -->
            <div class="group-box grp-selected-y">
                <span class="group-box-title">y축 선택 데이터</span>
                <div class="list-widget" id="selectedYList" tabindex="0"></div>
                <button class="btn" id="btnRemoveData">❌ 제거</button>
            </div>

            <!-- 그래프 출력 및 전체 선택 -->
            <button class="btn" id="btnPlot">📈 그래프 출력</button>
            <button class="btn" id="btnSelectAllY">✅ 유효 CH 전체 선택</button>

            <div style="flex: 0.2;"></div>
            <button class="btn btn-danger" id="btnExit">❌ 종료</button>
        </div>

        <!-- Vertical Splitter Handle -->
        <div class="splitter-v" id="splitterV"></div>

        <!-- Right Panel -->
        <div class="right-panel" id="rightPanel">
            <!-- Top Graph Panel -->
            <div class="graph-panel" id="graphPanel">
                <!-- Matplotlib-like Navigation Toolbar -->
                <div class="mpl-toolbar">
                    <button class="tool-btn" id="toolHome" title="초기 배율로 복원 (Home)">🏠 초기화</button>
                    <button class="tool-btn" id="toolZoom" title="마우스 드래그로 영역 확대 (Box Zoom)">🔍 영역 확대</button>
                    <button class="tool-btn" id="toolPan" title="마우스 드래그로 그래프 이동 (Pan)">✋ 이동</button>
                    <span style="font-size: 8.5pt; color: #64748B; margin-left: 6px;">
                        💡 팁: 마우스 커서를 선 위에 올리면 상세 좌표 툴팁이 표시됩니다.
                    </span>
                    <span class="toolbar-coords" id="toolbarCoords"></span>
                </div>

                <!-- Interactive High-DPI Matplotlib-Style Canvas -->
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="plotCanvas"></canvas>
                </div>

                <!-- 그래프 확대 범위 및 저장 -->
                <div class="group-box" style="flex-shrink: 0;">
                    <span class="group-box-title">그래프 확대 범위 및 저장</span>
                    <div class="graph-control-grid">
                        <!-- Row 0: X-Axis Range -->
                        <label class="control-label" for="editXMin">x축 최소값</label>
                        <input type="text" class="line-edit" id="editXMin" placeholder="예: 00:00 / 08-10 07:43 / 2026-08-10 07:43" />
                        <label class="control-label" for="editXMax">x축 최대값</label>
                        <input type="text" class="line-edit" id="editXMax" placeholder="예: 01:00 / 08-10 08:43 / 2026-08-10 08:43" />
                        <button class="btn" id="btnApplyX">x축 선택</button>

                        <!-- Row 1: Y-Axis Range -->
                        <label class="control-label" for="editYMin">y축 최소값</label>
                        <input type="text" class="line-edit" id="editYMin" placeholder="예: 10" />
                        <label class="control-label" for="editYMax">y축 최대값</label>
                        <input type="text" class="line-edit" id="editYMax" placeholder="예: 100" />
                        <button class="btn" id="btnApplyY">y축 선택</button>

                        <!-- Row 2: Save Buttons -->
                        <div></div>
                        <div></div>
                        <div></div>
                        <button class="btn" id="btnSaveCsv" style=" justify-self: end; width: 100%; max-width: 180px;">💾 CSV 파일 저장</button>
                        <button class="btn" id="btnSaveJpg">🖼 그래프(jpg) 저장</button>
                    </div>
                </div>
            </div>

            <!-- Horizontal Splitter Handle -->
            <div class="splitter-h" id="splitterH"></div>

            <!-- Bottom Analysis Panel -->
            <div class="analysis-panel" id="analysisPanel">
                <div class="group-box analysis-group">
                    <span class="group-box-title">데이터 분석 출력</span>
                    <textarea class="analysis-text" id="analysisText" readonly spellcheck="false"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Dialog -->
<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box">
        <div class="modal-header">
            <span id="modalTitle">알림</span>
        </div>
        <div class="modal-body" id="modalMessage"></div>
        <div class="modal-footer">
            <button class="btn" id="modalOkBtn" style="padding: 6px 20px;">확인</button>
        </div>
    </div>
</div>

<script>
/**
 * 엑셀/CSV 데이터 Graph Analyzer V1.0
 * 01_General_CSV_Analyzer_1.py 의 모든 전처리/시계열 파싱/통계/그래프 기능을 100% 동일하게 브라우저에서 구현
 */
(() => {
    // -------------------------------------------------------------------------
    // Global Application State (mirrors CompVibOverallGraphGUI attributes)
    // -------------------------------------------------------------------------
    const state = {
        df: null,                // Array of row objects (sorted by Time_dt)
        columns: [],             // Standardized column names
        fileName: null,          // Loaded file name
        zeroColumns: [],         // Constant/empty columns removed from analysis
        nonzeroColumns: [],      // Active columns with >1 unique value
        currentPlotDf: null,     // Filtered rows currently plotted
        currentXCol: "Time",     // Selected X column
        currentYCols: [],        // Selected Y columns

        // List widget selections
        xSelected: [],           // Single selection array
        ySelected: [],           // Multi selection in y_list
         yLastClickedIdx: -1,
        selectedYItems: [],      // Items added to selected_y_list
        selectedYHighlight: [],  // Highlighted items inside selected_y_list
        selectedYLastIdx: -1,

        // Interactive Graph State
        plotSeries: [],          // [{ col, color, points: [{x, y, rawRow}] }]
        xDomain: [0, 1],         // Current [xMin, xMax]
        yDomain: [0, 1],         // Current [yMin, yMax]
        initialXDomain: [0, 1],
        initialYDomain: [0, 1],
        isTimeAxis: true,
        hasYearGT1900: true,
        hoverPoint: null,        // { col, color, xVal, yVal, screenX, screenY }
        interactionMode: null,   // null | 'zoom' | 'pan'
        dragStart: null,         // { x, y, xDomain, yDomain }
        dragCurrent: null        // { x, y }
    };

    const COLOR_CYCLE = [
        "#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd",
        "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf",
        "#003f5c", "#58508d", "#bc5090", "#ff6361", "#ffa600",
        "#006d77", "#83c5be", "#3a86ff", "#8338ec", "#fb5607"
    ];

    // DOM Elements
    const fileInput = document.getElementById("fileInput");
    const btnLoadCsv = document.getElementById("btnLoadCsv");
    const lblFile = document.getElementById("lblFile");
    const xListEl = document.getElementById("xList");
    const yListEl = document.getElementById("yList");
    const selectedYListEl = document.getElementById("selectedYList");
    const btnSelectData = document.getElementById("btnSelectData");
    const btnRemoveData = document.getElementById("btnRemoveData");
    const btnPlot = document.getElementById("btnPlot");
    const btnSelectAllY = document.getElementById("btnSelectAllY");
    const btnExit = document.getElementById("btnExit");

    const editXMin = document.getElementById("editXMin");
    const editXMax = document.getElementById("editXMax");
    const btnApplyX = document.getElementById("btnApplyX");
    const editYMin = document.getElementById("editYMin");
    const editYMax = document.getElementById("editYMax");
    const btnApplyY = document.getElementById("btnApplyY");
    const btnSaveCsv = document.getElementById("btnSaveCsv");
    const btnSaveJpg = document.getElementById("btnSaveJpg");

    const toolHome = document.getElementById("toolHome");
    const toolZoom = document.getElementById("toolZoom");
    const toolPan = document.getElementById("toolPan");
    const toolbarCoords = document.getElementById("toolbarCoords");

    const canvasContainer = document.getElementById("canvasContainer");
    const plotCanvas = document.getElementById("plotCanvas");
    const analysisText = document.getElementById("analysisText");
    const statusBadge = document.getElementById("statusBadge");

    // -------------------------------------------------------------------------
    // Modal Helper (QMessageBox equivalent)
    // -------------------------------------------------------------------------
    function showMessageBox(title, message) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalMessage").textContent = message;
        document.getElementById("modalBackdrop").classList.add("show");
    }
    document.getElementById("modalOkBtn").addEventListener("click", () => {
        document.getElementById("modalBackdrop").classList.remove("show");
    });

    // -------------------------------------------------------------------------
    // 1. File Reading & Smart Encoding Detection (UTF-8 / CP949 / EUC-KR / XLSX)
    // -------------------------------------------------------------------------
    btnLoadCsv.addEventListener("click", () => {
        fileInput.value = "";
        fileInput.click();
    });

    fileInput.addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        await handleFileLoad(file);
    });

    async function handleFileLoad(file) {
        try {
            statusBadge.textContent = "Loading...";
            const buffer = await file.arrayBuffer();
            const ext = file.name.substring(file.name.lastIndexOf(".")).toLowerCase();

            let rawParsed;
            if (ext === ".xlsx" || ext === ".xls") {
                rawParsed = parseExcelBuffer(buffer);
            } else {
                const text = decodeCsvSmart(buffer);
                rawParsed = parseCsvText(text);
            }

            const stdData = standardizeColumns(rawParsed.headers, rawParsed.rows);
            const processed = preprocessDataframe(stdData.columns, stdData.rows);

            state.fileName = file.name;
            state.df = processed.df;
            state.columns = processed.columns;
            state.zeroColumns = processed.zeroColumns;
            state.nonzeroColumns = processed.nonzeroColumns;
            state.currentPlotDf = null;
            state.currentYCols = [];
            state.currentXCol = "Time";
            state.selectedYItems = [];
            state.selectedYHighlight = [];

            lblFile.textContent = `선택된 파일: ${state.fileName}`;
            populateColumnLists();
            updateFileInformationOnly();
            drawEmptyGraph();
            statusBadge.textContent = `Loaded: ${state.fileName} (${state.df.length.toLocaleString()} rows)`;
        } catch (err) {
            statusBadge.textContent = "Error";
            showMessageBox("CSV 로딩 오류", `CSV 파일 로딩 중 오류가 발생했습니다.\n\n${err.message || err}`);
        }
    }

    function decodeCsvSmart(buffer) {
        const uint8 = new Uint8Array(buffer);
        // Check UTF-8 BOM
        if (uint8.length >= 3 && uint8[0] === 0xEF && uint8[1] === 0xBB && uint8[2] === 0xBF) {
            return new TextDecoder("utf-8").decode(uint8.subarray(3));
        }
        // Try strict UTF-8 first
        try {
            return new TextDecoder("utf-8", { fatal: true }).decode(uint8);
        } catch (_) {
            // Fallback to EUC-KR / CP949 (WHATWG 'euc-kr' decoder handles CP949 extensions)
            try {
                return new TextDecoder("euc-kr", { fatal: false }).decode(uint8);
            } catch (err) {
                throw new Error("CSV 파일 인코딩을 확인할 수 없습니다. 지원 인코딩: UTF-8-SIG, CP949, EUC-KR");
            }
        }
    }

    function parseExcelBuffer(buffer) {
        if (typeof XLSX === "undefined") {
            throw new Error("엑셀(xlsx) 파서 라이브러리가 로드되지 않았습니다.");
        }
        const workbook = XLSX.read(buffer, { type: "array", cellDates: true });
        const firstSheetName = workbook.SheetNames[0];
        if (!firstSheetName) throw new Error("엑셀 파일에 시트가 없습니다.");
        const sheet = workbook.Sheets[firstSheetName];
        const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
        if (!aoa || aoa.length < 2) throw new Error("엑셀 파일에 데이터가 없습니다.");
        const rawHeaders = aoa[0].map(h => String(h ?? "").trim());
        if (rawHeaders.length < 2) throw new Error("엑셀 파일에서 2개 이상의 column을 찾지 못했습니다.");
        const headers = mangleDupeCols(rawHeaders);
        const rows = [];
        for (let r = 1; r < aoa.length; r++) {
            const rowArr = aoa[r];
            if (!rowArr || rowArr.every(cell => String(cell ?? "").trim() === "")) continue;
            rows.push(rowArr.map(cell => String(cell ?? "").trim()));
        }
        if (rows.length === 0) throw new Error("엑셀 파일에 데이터가 없습니다.");
        return { headers, rows };
    }

    // Mimics pandas read_csv(..., header=0, skipinitialspace=True)
    function parseCsvText(text) {
        const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
        const nonEmptyLines = [];
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].trim() !== "") {
                nonEmptyLines.push(lines[i]);
            }
        }
        if (nonEmptyLines.length < 2) {
            throw new Error("CSV 파일에 데이터가 없습니다.");
        }

        const rawHeaders = parseCsvLine(nonEmptyLines[0], true);
        if (rawHeaders.length < 2) {
            throw new Error("CSV 파일에서 2개 이상의 column을 찾지 못했습니다.");
        }
        const headers = mangleDupeCols(rawHeaders);

        const rows = [];
        for (let i = 1; i < nonEmptyLines.length; i++) {
            const parsedRow = parseCsvLine(nonEmptyLines[i], true);
            if (parsedRow.length === 1 && parsedRow[0] === "") continue;
            rows.push(parsedRow);
        }
        if (rows.length === 0) {
            throw new Error("CSV 파일에 데이터가 없습니다.");
        }
        return { headers, rows };
    }

    // RFC-4180 CSV line parser with skipinitialspace=True
    function parseCsvLine(line, skipInitialSpace = true) {
        const result = [];
        let cur = "";
        let inQuotes = false;
        let i = 0;
        const len = line.length;

        while (i < len) {
            const ch = line[i];
            if (!inQuotes && cur === "" && skipInitialSpace && ch === " ") {
                i++;
                continue;
            }
            if (ch === '"') {
                if (inQuotes && i + 1 < len && line[i + 1] === '"') {
                    cur += '"';
                    i += 2;
                    continue;
                }
                inQuotes = !inQuotes;
                i++;
                continue;
            }
            if (ch === "," && !inQuotes) {
                result.push(cur);
                cur = "";
                i++;
                continue;
            }
            cur += ch;
            i++;
        }
        result.push(cur);
        return result;
    }

    // Mimics pandas default mangle_dupe_cols before _standardize_columns
    function mangleDupeCols(rawHeaders) {
        const counts = {};
        return rawHeaders.map((h, idx) => {
            let name = String(h ?? "");
            if (name === "") {
                name = `Unnamed: ${idx}`;
            }
            if (counts[name] === undefined) {
                counts[name] = 0;
                return name;
            } else {
                counts[name] += 1;
                return `${name}.${counts[name]}`;
            }
        });
    }

    // -------------------------------------------------------------------------
    // 2. Column Standardization & Time Series / Numeric Preprocessing
    // -------------------------------------------------------------------------
    function standardizeColumns(rawHeaders, rawRows) {
        const columns = [];
        const seen = {};
        for (let i = 0; i < rawHeaders.length; i++) {
            let c = String(rawHeaders[i]).trim().replace(/'/g, "");
            if (c === "" || c.toLowerCase().startsWith("unnamed")) {
                c = (i === 0) ? "Time" : `CH${i}`;
            }
            if (Object.prototype.hasOwnProperty.call(seen, c)) {
                seen[c] += 1;
                c = `${c}_${seen[c]}`;
            } else {
                seen[c] = 0;
            }
            columns.push(c);
        }

        if (!columns.includes("Time") && columns.length > 0) {
            columns[0] = "Time";
        }

        return { columns, rows: rawRows };
    }

    function parseSingleTimeStr(rawStr) {
        let s = String(rawStr ?? "").trim().replace(/'/g, "");
        s = s.replace(/\s+/g, " ");
        s = s.replace(/오전/g, "AM").replace(/오후/g, "PM");
        if (!s) return null;

        // 1. YYYY-MM-DD (AM/PM) hh:mm(:ss)(.fff) or YYYY-MM-DD hh:mm(:ss)(.fff) (AM/PM)
        // Format A: YYYY-MM-DD AM/PM I:M(:S)(.f)
        let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})\s+(AM|PM)\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?$/i);
        if (m) {
            const year = parseInt(m[1], 10);
            const month = parseInt(m[2], 10);
            const day = parseInt(m[3], 10);
            const ampm = m[4].toUpperCase();
            let hour = parseInt(m[5], 10);
            const min = parseInt(m[6], 10);
            const sec = m[7] ? parseInt(m[7], 10) : 0;
            const ms = m[8] ? parseInt(m[8].padEnd(3, "0").slice(0, 3), 10) : 0;
            if (hour < 1 || hour > 12) return null;
            if (ampm === "AM" && hour === 12) hour = 0;
            if (ampm === "PM" && hour < 12) hour += 12;
            return new Date(year, month - 1, day, hour, min, sec, ms);
        }

        // Format B: YYYY-MM-DD I:M(:S)(.f) AM/PM
        m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?\s+(AM|PM)$/i);
        if (m) {
            const year = parseInt(m[1], 10);
            const month = parseInt(m[2], 10);
            const day = parseInt(m[3], 10);
            let hour = parseInt(m[4], 10);
            const min = parseInt(m[5], 10);
            const sec = m[6] ? parseInt(m[6], 10) : 0;
            const ms = m[7] ? parseInt(m[7].padEnd(3, "0").slice(0, 3), 10) : 0;
            const ampm = m[8].toUpperCase();
            if (hour < 1 || hour > 12) return null;
            if (ampm === "AM" && hour === 12) hour = 0;
            if (ampm === "PM" && hour < 12) hour += 12;
            return new Date(year, month - 1, day, hour, min, sec, ms);
        }

        // Format C: YYYY-MM-DD HH:MM(:SS)(.fff) (24-hour)
        m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?$/);
        if (m) {
            const year = parseInt(m[1], 10);
            const month = parseInt(m[2], 10);
            const day = parseInt(m[3], 10);
            const hour = parseInt(m[4], 10);
            const min = parseInt(m[5], 10);
            const sec = m[6] ? parseInt(m[6], 10) : 0;
            const ms = m[7] ? parseInt(m[7].padEnd(3, "0").slice(0, 3), 10) : 0;
            return new Date(year, month - 1, day, hour, min, sec, ms);
        }

        // Format D: Time-only HH:MM(:SS)(.fff) -> year 1900, month 1, day 1
        m = s.match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?$/);
        if (m) {
            const hour = parseInt(m[1], 10);
            const min = parseInt(m[2], 10);
            const sec = m[3] ? parseInt(m[3], 10) : 0;
            const ms = m[4] ? parseInt(m[4].padEnd(3, "0").slice(0, 3), 10) : 0;
            return new Date(1900, 0, 1, hour, min, sec, ms);
        }

        // Format E: MM-DD HH:MM(:SS)(.fff)
        m = s.match(/^(\d{1,2})[-/](\d{1,2})\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?$/);
        if (m) {
            const month = parseInt(m[1], 10);
            const day = parseInt(m[2], 10);
            const hour = parseInt(m[3], 10);
            const min = parseInt(m[4], 10);
            const sec = m[5] ? parseInt(m[5], 10) : 0;
            const ms = m[6] ? parseInt(m[6].padEnd(3, "0").slice(0, 3), 10) : 0;
            return new Date(1900, month - 1, day, hour, min, sec, ms);
        }

        const fallback = new Date(s);
        if (!isNaN(fallback.getTime())) {
            return fallback;
        }
        return null;
    }

    function toNumericOrNaN(val) {
        if (val === null || val === undefined) return NaN;
        const s = String(val).trim();
        if (s === "" || s.toLowerCase() === "nan" || s.toLowerCase() === "null" || s.toLowerCase() === "none") {
            return NaN;
        }
        const n = Number(s);
        return Number.isFinite(n) ? n : NaN;
    }

    function preprocessDataframe(columns, rawRows) {
        const timeColIdx = columns.indexOf("Time");
        const yColIndices = [];
        const yCols = [];
        for (let i = 0; i < columns.length; i++) {
            if (columns[i] !== "Time" && columns[i] !== "Time_dt") {
                yColIndices.push(i);
                yCols.push(columns[i]);
            }
        }

        const failedTimes = [];
        const rows = [];

        for (let r = 0; r < rawRows.length; r++) {
            const rawRow = rawRows[r];
            const rawTime = String(rawRow[timeColIdx] ?? "").trim().replace(/'/g, "");
            const dt = parseSingleTimeStr(rawTime);
            if (!dt || isNaN(dt.getTime())) {
                if (failedTimes.length < 5) failedTimes.push(rawTime);
            }
            const rowObj = {
                Time: rawTime,
                Time_dt: dt ? dt.getTime() : NaN,
                _origIdx: r
            };
            for (let j = 0; j < yCols.length; j++) {
                const colName = yCols[j];
                const colIdx = yColIndices[j];
                rowObj[colName] = toNumericOrNaN(rawRow[colIdx]);
            }
            rows.push(rowObj);
        }

        if (failedTimes.length > 0) {
            throw new Error(`Time 컬럼의 일부 값을 시간 형식으로 변환하지 못했습니다. 예: ${failedTimes.join(", ")}`);
        }

        // Separate zero_columns (<= 1 unique non-NaN value) vs nonzero_columns
        const zeroColumns = [];
        const nonzeroColumns = [];

        for (let j = 0; j < yCols.length; j++) {
            const col = yCols[j];
            const uniqueVals = new Set();
            for (let r = 0; r < rows.length; r++) {
                const v = rows[r][col];
                if (!Number.isNaN(v)) {
                    uniqueVals.add(v);
                    if (uniqueVals.size > 1) break;
                }
            }
            if (uniqueVals.size <= 1) {
                zeroColumns.push(col);
            } else {
                nonzeroColumns.push(col);
            }
        }

        // Keep only Time, Time_dt, and nonzeroColumns, then mergesort (stable sort) by Time_dt
        const cleanRows = rows.map(r => {
            const obj = {
                Time: r.Time,
                Time_dt: r.Time_dt,
                _origIdx: r._origIdx
            };
            for (let i = 0; i < nonzeroColumns.length; i++) {
                const c = nonzeroColumns[i];
                obj[c] = r[c];
            }
            return obj;
        });

        cleanRows.sort((a, b) => {
            if (a.Time_dt !== b.Time_dt) return a.Time_dt - b.Time_dt;
            return a._origIdx - b._origIdx;
        });

        return {
            df: cleanRows,
            columns: ["Time", "Time_dt", ...nonzeroColumns],
            zeroColumns,
            nonzeroColumns
        };
    }

    // -------------------------------------------------------------------------
    // 3. UI List Widgets & Selection Logic
    // -------------------------------------------------------------------------
    function populateColumnLists() {
        const xCandidates = ["Time", ...state.nonzeroColumns];
        state.xSelected = ["Time"];
        state.ySelected = [];
        state.yLastClickedIdx = -1;
        state.selectedYItems = [];
        state.selectedYHighlight = [];
        state.selectedYLastIdx = -1;

        renderXList(xCandidates);
        renderYList();
        renderSelectedYList();
    }

    function renderXList(xCandidates) {
        xListEl.innerHTML = "";
        xCandidates.forEach((col) => {
            const div = document.createElement("div");
            div.className = "list-item" + (state.xSelected.includes(col) ? " selected" : "");
            div.textContent = col;
            div.addEventListener("click", () => {
                state.xSelected = [col];
                renderXList(xCandidates);
            });
            xListEl.appendChild(div);
        });
    }

    function renderYList() {
        yListEl.innerHTML = "";
        state.nonzeroColumns.forEach((col, idx) => {
            const div = document.createElement("div");
            div.className = "list-item" + (state.ySelected.includes(col) ? " selected" : "");
            div.textContent = col;

            div.addEventListener("click", (e) => {
                if (e.shiftKey && state.yLastClickedIdx !== -1) {
                    const start = Math.min(state.yLastClickedIdx, idx);
                    const end = Math.max(state.yLastClickedIdx, idx);
                    const rangeCols = state.nonzeroColumns.slice(start, end + 1);
                    if (e.ctrlKey || e.metaKey) {
                        const set = new Set([...state.ySelected, ...rangeCols]);
                        state.ySelected = Array.from(set);
                    } else {
                        state.ySelected = rangeCols;
                    }
                } else if (e.ctrlKey || e.metaKey) {
                    if (state.ySelected.includes(col)) {
                        state.ySelected = state.ySelected.filter(c => c !== col);
                    } else {
                        state.ySelected.push(col);
                    }
                    state.yLastClickedIdx = idx;
                } else {
                    state.ySelected = [col];
                    state.yLastClickedIdx = idx;
                }
                renderYList();
            });

            div.addEventListener("dblclick", () => {
                if (!state.selectedYItems.includes(col)) {
                    state.selectedYItems.push(col);
                    renderSelectedYList();
                }
            });

            yListEl.appendChild(div);
        });
    }

    function renderSelectedYList() {
        selectedYListEl.innerHTML = "";
        state.selectedYItems.forEach((col, idx) => {
            const div = document.createElement("div");
            div.className = "list-item" + (state.selectedYHighlight.includes(col) ? " selected" : "");
            div.textContent = col;

            div.addEventListener("click", (e) => {
                if (e.shiftKey && state.selectedYLastIdx !== -1) {
                    const start = Math.min(state.selectedYLastIdx, idx);
                    const end = Math.max(state.selectedYLastIdx, idx);
                    state.selectedYHighlight = state.selectedYItems.slice(start, end + 1);
                } else if (e.ctrlKey || e.metaKey) {
                    if (state.selectedYHighlight.includes(col)) {
                        state.selectedYHighlight = state.selectedYHighlight.filter(c => c !== col);
                    } else {
                        state.selectedYHighlight.push(col);
                    }
                    state.selectedYLastIdx = idx;
                } else {
                    state.selectedYHighlight = [col];
                    state.selectedYLastIdx = idx;
                }
                renderSelectedYList();
            });

            div.addEventListener("dblclick", () => {
                state.selectedYItems = state.selectedYItems.filter(c => c !== col);
                state.selectedYHighlight = state.selectedYHighlight.filter(c => c !== col);
                renderSelectedYList();
            });

            selectedYListEl.appendChild(div);
        });
    }

    btnSelectData.addEventListener("click", () => {
