    // -------------------------------------------------------------------------
    // 4. Time Bound Parsing & Filtering (Mirrors _make_filtered_plot_dataframe)
    // -------------------------------------------------------------------------
    function parseTimeBound(text, referenceDf, isMax = false) {
        let rawText = String(text ?? "").trim().replace(/'/g, "");
        rawText = rawText.replace(/\s+/g, " ");
        rawText = rawText.replace(/오전/g, "AM").replace(/오후/g, "PM");

        let refDate = null;
        if (referenceDf && referenceDf.length > 0) {
            let boundTs = isMax ? -Infinity : Infinity;
            for (let i = 0; i < referenceDf.length; i++) {
                const ts = referenceDf[i].Time_dt;
                if (!Number.isNaN(ts)) {
                    if (isMax && ts > boundTs) boundTs = ts;
                    if (!isMax && ts < boundTs) boundTs = ts;
                }
            }
            if (Number.isFinite(boundTs)) {
                refDate = new Date(boundTs);
            }
        }

        // 1. No-year formats: %m-%d %H:%M:%S.%f, %m-%d %H:%M:%S, %m-%d %H:%M
        if (refDate !== null) {
            const refYear = refDate.getFullYear();
            const mNoYear = rawText.match(/^(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?$/);
            if (mNoYear) {
                const month = parseInt(mNoYear[1], 10);
                const day = parseInt(mNoYear[2], 10);
                const hour = parseInt(mNoYear[3], 10);
                const min = parseInt(mNoYear[4], 10);
                const sec = mNoYear[5] ? parseInt(mNoYear[5], 10) : 0;
                const ms = mNoYear[6] ? parseInt(mNoYear[6].padEnd(3, "0").slice(0, 3), 10) : 0;
                return new Date(refYear, month - 1, day, hour, min, sec, ms).getTime();
            }
        }

        // 2. Time-only formats: %H:%M:%S.%f, %H:%M:%S, %H:%M
        const mTimeOnly = rawText.match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2})(?:\.(\d+))?)?$/);
        if (mTimeOnly) {
            const hour = parseInt(mTimeOnly[1], 10);
            const min = parseInt(mTimeOnly[2], 10);
            const sec = mTimeOnly[3] ? parseInt(mTimeOnly[3], 10) : 0;
            const ms = mTimeOnly[4] ? parseInt(mTimeOnly[4].padEnd(3, "0").slice(0, 3), 10) : 0;
            if (refDate !== null && refDate.getFullYear() > 1900) {
                return new Date(
                    refDate.getFullYear(),
                    refDate.getMonth(),
                    refDate.getDate(),
                    hour, min, sec, ms
                ).getTime();
            }
            return new Date(1900, 0, 1, hour, min, sec, ms).getTime();
        }

        // 3. Full formats with year
        const dt = parseSingleTimeStr(rawText);
        if (dt && !isNaN(dt.getTime())) {
            return dt.getTime();
        }

        throw new Error(`x축 시간 범위를 해석할 수 없습니다: ${rawText}`);
    }

    function makeFilteredPlotDataframe(xCol, yCols) {
        const xMinText = editXMin.value.trim();
        const xMaxText = editXMax.value.trim();

        let filtered = state.df;

        if (xCol === "Time") {
            if (xMinText) {
                const xMinTs = parseTimeBound(xMinText, filtered, false);
                filtered = filtered.filter(r => r.Time_dt >= xMinTs);
            }
            if (xMaxText) {
                const xMaxTs = parseTimeBound(xMaxText, filtered, true);
                filtered = filtered.filter(r => r.Time_dt <= xMaxTs);
            }
        } else {
            const minVal = xMinText ? Number(xMinText) : null;
            const maxVal = xMaxText ? Number(xMaxText) : null;
            if (xMinText && Number.isNaN(minVal)) {
                throw new Error(`x축 최소값을 숫자로 변환할 수 없습니다: ${xMinText}`);
            }
            if (xMaxText && Number.isNaN(maxVal)) {
                throw new Error(`x축 최대값을 숫자로 변환할 수 없습니다: ${xMaxText}`);
            }
            filtered = filtered.filter(r => {
                const v = r[xCol];
                if (Number.isNaN(v)) return false;
                if (minVal !== null && v < minVal) return false;
                if (maxVal !== null && v > maxVal) return false;
                return true;
            });
        }

        return filtered;
    }

    // -------------------------------------------------------------------------
    // 5. Plot Execution & Statistics Calculation
    // -------------------------------------------------------------------------
    btnPlot.addEventListener("click", plotSelectedData);
    btnApplyX.addEventListener("click", plotSelectedData);
    btnApplyY.addEventListener("click", plotSelectedData);

    function plotSelectedData() {
        if (!state.df) {
            showMessageBox("데이터 없음", "먼저 csv/xlsx 파일을 로딩해 주세요.");
            return;
        }
        if (state.xSelected.length === 0) {
            showMessageBox("x축 선택 필요", "x축 데이터를 선택해 주세요.");
            return;
        }
        if (state.selectedYItems.length === 0) {
            showMessageBox("y축 선택 필요", "그래프로 출력할 y축 데이터를 1개 이상 선택해 주세요.");
            return;
        }

        const xCol = state.xSelected[0];
        const yCols = [...state.selectedYItems];
        state.currentXCol = xCol;
        state.currentYCols = yCols;

        try {
            const plotDf = makeFilteredPlotDataframe(xCol, yCols);
            if (!plotDf || plotDf.length === 0) {
                throw new Error("선택한 x축 범위에 해당하는 데이터가 없습니다.");
            }

            // Prepare Plot Series and Validate Y-axis Range before updating state
            prepareAndDrawPlot(plotDf, xCol, yCols);
            state.currentPlotDf = plotDf;
            updateAnalysisText(plotDf, xCol, yCols);
        } catch (err) {
            showMessageBox("그래프 출력 오류", `그래프 출력 중 오류가 발생했습니다.\n\n${err.message || err}`);
        }
    }

    // -------------------------------------------------------------------------
    // 6. Analysis Console Output (Exact match with 01_General_CSV_Analyzer_1.py)
    // -------------------------------------------------------------------------
    function pad2(n) {
        return String(n).padStart(2, "0");
    }
    function pad3(n) {
        return String(n).padStart(3, "0");
    }

    function formatTimeForAnalysis(ts) {
        if (ts === null || ts === undefined || Number.isNaN(ts)) return "-";
        const d = new Date(ts);
        if (isNaN(d.getTime())) return "-";
        const hh = pad2(d.getHours());
        const mm = pad2(d.getMinutes());
        const ss = pad2(d.getSeconds());
        const ms = pad3(d.getMilliseconds());
        if (d.getFullYear() > 1900) {
            const mo = pad2(d.getMonth() + 1);
            const da = pad2(d.getDate());
            return `${mo}-${da} ${hh}:${mm}:${ss}.${ms}`;
        }
        return `${hh}:${mm}:${ss}.${ms}`;
    }

    function formatTimeForSavedCsv(ts) {
        if (ts === null || ts === undefined || Number.isNaN(ts)) return "";
        const d = new Date(ts);
        if (isNaN(d.getTime())) return "";
        const yyyy = d.getFullYear();
        const mo = pad2(d.getMonth() + 1);
        const da = pad2(d.getDate());
        const hh = pad2(d.getHours());
        const mm = pad2(d.getMinutes());
        const ss = pad2(d.getSeconds());
        const ms = pad3(d.getMilliseconds());
        return `${yyyy}-${mo}-${da} ${hh}:${mm}:${ss}.${ms}`;
    }

    function makeFileInfoText() {
        const zeroNames = state.zeroColumns.length > 0 ? state.zeroColumns.join(", ") : "없음";
        const nonzeroNames = state.nonzeroColumns.length > 0 ? state.nonzeroColumns.join(", ") : "없음";
        return (
            "[File Information]\n" +
            `- 선택 CSV 파일 이름: ${state.fileName}\n` +
            `- 총 데이터 행의 갯수: ${state.df.length.toLocaleString("en-US")}\n` +
            `- 모든 값이 동일하여 삭제된 column 갯수: ${state.zeroColumns.length.toLocaleString("en-US")}\n` +
            `- 모든 값이 동일하여 삭제된 column name: ${zeroNames}\n` +
            `- 그래프/분석 대상 column 갯수: ${state.nonzeroColumns.length.toLocaleString("en-US")}\n` +
            `- 그래프/분석 대상 column name: ${nonzeroNames}\n`
        );
    }

    function updateFileInformationOnly() {
        if (!state.df) return;
        analysisText.value = makeFileInfoText();
    }

    function updateAnalysisText(plotDf, xCol, yCols) {
        const lines = [makeFileInfoText(), "", "[Data Analysis]"];

        if (xCol === "Time") {
            let minTs = Infinity;
            let maxTs = -Infinity;
            for (let i = 0; i < plotDf.length; i++) {
                const t = plotDf[i].Time_dt;
                if (!Number.isNaN(t)) {
                    if (t < minTs) minTs = t;
                    if (t > maxTs) maxTs = t;
                }
            }
            const xMinStr = formatTimeForAnalysis(minTs);
            const xMaxStr = formatTimeForAnalysis(maxTs);
            lines.push(`- 분석 x축 범위: ${xMinStr} ~ ${xMaxStr}`);
        } else {
            let minX = Infinity;
            let maxX = -Infinity;
            for (let i = 0; i < plotDf.length; i++) {
                const v = plotDf[i][xCol];
                if (!Number.isNaN(v)) {
                    if (v < minX) minX = v;
                    if (v > maxX) maxX = v;
                }
            }
            lines.push(`- 분석 x축 column: ${xCol}`);
            lines.push(`- 분석 x축 범위: ${minX} ~ ${maxX}`);
        }

        lines.push(`- 선택 y축 column 갯수: ${yCols.length.toLocaleString("en-US")}`);
        lines.push("");

        const headerLine =
            "Column".padEnd(22, " ") +
            "Count".padStart(10, " ") +
            "Mean".padStart(14, " ") +
            "Max".padStart(14, " ") +
            "Max Time".padStart(18, " ") +
            "Min".padStart(14, " ") +
            "Min Time".padStart(18, " ") +
            "Std".padStart(14, " ") +
            "RMS".padStart(14, " ") +
            "Range".padStart(14, " ") +
            "Peak-Peak".padStart(14, " ");
        lines.push(headerLine);
        lines.push("-".repeat(166));

        for (const col of yCols) {
            const validValues = [];
            let maxV = -Infinity;
            let minV = Infinity;
            let maxRow = null;
            let minRow = null;
            let sum = 0;
            let sumSq = 0;

            for (let i = 0; i < plotDf.length; i++) {
                const v = plotDf[i][col];
                if (!Number.isNaN(v)) {
                    validValues.push(v);
                    sum += v;
                    sumSq += v * v;
                    if (v > maxV) {
                        maxV = v;
                        maxRow = plotDf[i];
                    }
                    if (v < minV) {
                        minV = v;
                        minRow = plotDf[i];
                    }
                }
            }

            const countV = validValues.length;
            if (countV === 0) continue;

            const meanV = sum / countV;
            let stdV = 0.0;
            if (countV > 1) {
                let varSum = 0;
                for (let i = 0; i < countV; i++) {
                    const diff = validValues[i] - meanV;
                    varSum += diff * diff;
                }
                stdV = Math.sqrt(varSum / (countV - 1)); // ddof=1 sample std
            }
            const rmsV = Math.sqrt(sumSq / countV);
            const rangeV = maxV - minV;
            const peakToPeakV = rangeV;

            const maxTime = xCol === "Time" && maxRow ? formatTimeForAnalysis(maxRow.Time_dt) : "-";
            const minTime = xCol === "Time" && minRow ? formatTimeForAnalysis(minRow.Time_dt) : "-";

            const rowLine =
                col.padEnd(22, " ") +
                countV.toLocaleString("en-US").padStart(10, " ") +
                meanV.toFixed(4).padStart(14, " ") +
                maxV.toFixed(4).padStart(14, " ") +
                maxTime.padStart(18, " ") +
                minV.toFixed(4).padStart(14, " ") +
                minTime.padStart(18, " ") +
                stdV.toFixed(4).padStart(14, " ") +
                rmsV.toFixed(4).padStart(14, " ") +
                rangeV.toFixed(4).padStart(14, " ") +
                peakToPeakV.toFixed(4).padStart(14, " ");

            lines.push(rowLine);
        }

        lines.push("");
        lines.push("[Note]");
        lines.push("- Count: numeric data count after removing NaN");
        lines.push("- Std: sample standard deviation, pandas std(ddof=1)");
        lines.push("- RMS: Root Mean Square = sqrt(mean(x^2))");
        lines.push("- Range / Peak-Peak: Max - Min");

        analysisText.value = lines.join("\n");
    }

    // -------------------------------------------------------------------------
    // 7. Matplotlib-Style Canvas Graph Engine
    // -------------------------------------------------------------------------
    function drawEmptyGraph() {
        state.plotSeries = [];
        state.hoverPoint = null;
        state.isTimeAxis = true;
        state.xDomain = [0, 1];
        state.yDomain = [0, 1];
        renderCanvas();
    }

    function prepareAndDrawPlot(plotDf, xCol, yCols) {
        const isTime = (xCol === "Time");
        let xMin = Infinity;
        let xMax = -Infinity;
        let yMinData = Infinity;
        let yMaxData = -Infinity;
        let hasYearGT1900 = false;

        const seriesList = [];

        for (let idx = 0; idx < yCols.length; idx++) {
            const col = yCols[idx];
            const color = COLOR_CYCLE[idx % COLOR_CYCLE.length];
            const points = [];

            for (let i = 0; i < plotDf.length; i++) {
                const row = plotDf[i];
                const xVal = isTime ? row.Time_dt : row[xCol];
                const yVal = row[col];
                if (Number.isNaN(xVal) || Number.isNaN(yVal)) continue;

                if (xVal < xMin) xMin = xVal;
                if (xVal > xMax) xMax = xVal;
                if (yVal < yMinData) yMinData = yVal;
                if (yVal > yMaxData) yMaxData = yVal;

                if (isTime && !hasYearGT1900) {
                    if (new Date(xVal).getFullYear() > 1900) {
                        hasYearGT1900 = true;
                    }
                }
                points.push({ x: xVal, y: yVal });
            }

            seriesList.push({ col, color, points });
        }

        if (!Number.isFinite(xMin) || !Number.isFinite(xMax)) {
            xMin = 0;
            xMax = 1;
        }
        if (xMin === xMax) {
            const pad = isTime ? 60000 : 1;
            xMin -= pad;
            xMax += pad;
        } else {
            // Matplotlib default 5% x margin
            const span = xMax - xMin;
            xMin -= span * 0.03;
            xMax += span * 0.03;
        }

        if (!Number.isFinite(yMinData) || !Number.isFinite(yMaxData)) {
            yMinData = 0;
            yMaxData = 1;
        }
        let autoYMin = yMinData;
        let autoYMax = yMaxData;
        if (autoYMin === autoYMax) {
            autoYMin -= 1;
            autoYMax += 1;
        } else {
            const ySpan = autoYMax - autoYMin;
            autoYMin -= ySpan * 0.05;
            autoYMax += ySpan * 0.05;
        }

        // Check user Y-axis bounds (edit_y_min / edit_y_max)
        const yMinText = editYMin.value.trim();
        const yMaxText = editYMax.value.trim();
        let finalYMin = autoYMin;
        let finalYMax = autoYMax;

        if (yMinText !== "" || yMaxText !== "") {
            if (yMinText !== "") {
                finalYMin = Number(yMinText);
                if (Number.isNaN(finalYMin)) {
                    throw new Error(`y축 최소값을 숫자로 변환할 수 없습니다: ${yMinText}`);
                }
            }
            if (yMaxText !== "") {
                finalYMax = Number(yMaxText);
                if (Number.isNaN(finalYMax)) {
                    throw new Error(`y축 최대값을 숫자로 변환할 수 없습니다: ${yMaxText}`);
                }
            }
            if (finalYMin >= finalYMax) {
                throw new Error("y축 최소값은 y축 최대값보다 작아야 합니다.");
            }
        }

        state.plotSeries = seriesList;
        state.isTimeAxis = isTime;
        state.hasYearGT1900 = hasYearGT1900;
        state.xDomain = [xMin, xMax];
        state.yDomain = [finalYMin, finalYMax];
        state.initialXDomain = [xMin, xMax];
        state.initialYDomain = [finalYMin, finalYMax];
        state.hoverPoint = null;

        renderCanvas();
    }

    function getPlotGeometry(width, height) {
        const left = 72;
        const right = 24;
        const top = 46;
        const bottom = 52;
        return {
            left,
            top,
            right: width - right,
            bottom: height - bottom,
            plotWidth: Math.max(10, width - left - right),
            plotHeight: Math.max(10, height - top - bottom)
        };
    }

    function formatXTick(val) {
        if (state.plotSeries.length === 0) {
            return val.toFixed(1);
        }
        if (state.isTimeAxis) {
            const d = new Date(val);
            if (isNaN(d.getTime())) return "";
            const hh = pad2(d.getHours());
            const mm = pad2(d.getMinutes());
            const ss = pad2(d.getSeconds());
            const spanMs = Math.abs(state.xDomain[1] - state.xDomain[0]);
            if (state.hasYearGT1900) {
                const mo = pad2(d.getMonth() + 1);
                const da = pad2(d.getDate());
                if (spanMs < 180000) {
                    return `${mo}-${da} ${hh}:${mm}:${ss}`;
                }
                return `${mo}-${da} ${hh}:${mm}`;
            } else {
                if (spanMs < 180000) {
                    return `${hh}:${mm}:${ss}`;
                }
                return `${hh}:${mm}`;
            }
        }
        return Number(val.toPrecision(6)).toString();
    }

    function formatHoverX(val) {
        if (state.isTimeAxis) {
            const d = new Date(val);
            const mo = pad2(d.getMonth() + 1);
            const da = pad2(d.getDate());
            const hh = pad2(d.getHours());
            const mm = pad2(d.getMinutes());
            const ss = pad2(d.getSeconds());
            return `${mo}-${da} ${hh}:${mm}:${ss}`;
        }
        return val.toFixed(4);
    }

    function renderCanvas(targetCtx = null, customWidth = null, customHeight = null, dprOverride = null) {
        const rect = canvasContainer.getBoundingClientRect();
        const width = customWidth || Math.max(300, Math.floor(rect.width));
        const height = customHeight || Math.max(180, Math.floor(rect.height));
        const dpr = dprOverride || window.devicePixelRatio || 1;

        let ctx = targetCtx;
        if (!ctx) {
            if (plotCanvas.width !== Math.floor(width * dpr) || plotCanvas.height !== Math.floor(height * dpr)) {
                plotCanvas.width = Math.floor(width * dpr);
                plotCanvas.height = Math.floor(height * dpr);
            }
            ctx = plotCanvas.getContext("2d");
        }

        ctx.save();
        ctx.scale(dpr, dpr);

        // Background
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, width, height);

        const geom = getPlotGeometry(width, height);
        const [xMin, xMax] = state.xDomain;
        const [yMin, yMax] = state.yDomain;

        // Plot Area Background
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(geom.left, geom.top, geom.plotWidth, geom.plotHeight);

        // Grid & Ticks (Matplotlib style dashed grid alpha=0.35)
        const xTicks = 6;
        const yTicks = 6;

        ctx.strokeStyle = "rgba(128, 128, 128, 0.35)";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);

        // Vertical grid lines & X tick labels
        ctx.fillStyle = "#1F2933";
        ctx.font = "11px 'Malgun Gothic', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";

        for (let i = 0; i <= xTicks; i++) {
            const ratio = i / xTicks;
            const xPx = geom.left + ratio * geom.plotWidth;
            const xVal = xMin + ratio * (xMax - xMin);

            ctx.beginPath();
            ctx.moveTo(xPx, geom.top);
            ctx.lineTo(xPx, geom.bottom);
            ctx.stroke();

            // Tick mark
            ctx.save();
            ctx.setLineDash([]);
            ctx.strokeStyle = "#334155";
            ctx.beginPath();
            ctx.moveTo(xPx, geom.bottom);
            ctx.lineTo(xPx, geom.bottom + 5);
            ctx.stroke();
            ctx.restore();

            ctx.fillText(formatXTick(xVal), xPx, geom.bottom + 8);
        }

        // Horizontal grid lines & Y tick labels
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        for (let i = 0; i <= yTicks; i++) {
            const ratio = i / yTicks;
            const yPx = geom.bottom - ratio * geom.plotHeight;
            const yVal = yMin + ratio * (yMax - yMin);

            ctx.beginPath();
            ctx.moveTo(geom.left, yPx);
            ctx.lineTo(geom.right, yPx);
            ctx.stroke();

            // Tick mark
            ctx.save();
            ctx.setLineDash([]);
            ctx.strokeStyle = "#334155";
            ctx.beginPath();
            ctx.moveTo(geom.left - 5, yPx);
            ctx.lineTo(geom.left, yPx);
            ctx.stroke();
            ctx.restore();

            const yLabel = Number(yVal.toFixed(2)).toString();
            ctx.fillText(yLabel, geom.left - 8, yPx);
        }

        ctx.setLineDash([]);

        // Plot Data Series (Clipped to Plot Area)
        if (state.plotSeries.length > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(geom.left, geom.top, geom.plotWidth, geom.plotHeight);
            ctx.clip();

            for (const series of state.plotSeries) {
                const pts = series.points;
                if (pts.length === 0) continue;

                ctx.strokeStyle = series.color;
                ctx.lineWidth = 1.75;
                ctx.lineJoin = "round";
                ctx.lineCap = "round";
                ctx.beginPath();

                let started = false;
                for (let i = 0; i < pts.length; i++) {
                    const px = geom.left + ((pts[i].x - xMin) / (xMax - xMin)) * geom.plotWidth;
                    const py = geom.bottom - ((pts[i].y - yMin) / (yMax - yMin)) * geom.plotHeight;
                    if (!started) {
                        ctx.moveTo(px, py);
                        started = true;
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.stroke();
            }
            ctx.restore();
        }

        // Plot Border Frame
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 1.1;
        ctx.strokeRect(geom.left, geom.top, geom.plotWidth, geom.plotHeight);

        // Title
        ctx.fillStyle = "#102A43";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if (state.plotSeries.length === 0) {
            ctx.font = "bold 14.5px 'Malgun Gothic', sans-serif";
            ctx.fillText("엑셀/CSV 데이터 Graph Analyzer V1.0", geom.left + geom.plotWidth / 2, 23);
        } else {
            ctx.font = "bold 13.5px 'Malgun Gothic', sans-serif";
            const yCols = state.currentYCols;
            const titleCols = yCols.slice(0, 6).join(", ") + (yCols.length > 6 ? " ..." : "");
            ctx.fillText(`${state.fileName} | ${titleCols}`, geom.left + geom.plotWidth / 2, 23);
        }

        // X Axis Label
        ctx.font = "12px 'Malgun Gothic', sans-serif";
        ctx.fillStyle = "#1F2933";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        const xAxisTitle = state.plotSeries.length === 0 ? "Time" : (state.currentXCol === "Time" ? "Time" : state.currentXCol);
        ctx.fillText(xAxisTitle, geom.left + geom.plotWidth / 2, height - 6);

        // Y Axis Label (Rotated)
        ctx.save();
        ctx.translate(18, geom.top + geom.plotHeight / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText("Value", 0, 0);
        ctx.restore();

        // Legend (Matplotlib frameon=True style)
        if (state.plotSeries.length > 0) {
            drawLegend(ctx, geom, state.plotSeries);
        }

        // Zoom Selection Box
        if (state.interactionMode === "zoom" && state.dragStart && state.dragCurrent) {
            ctx.save();
            const bx = Math.min(state.dragStart.x, state.dragCurrent.x);
            const by = Math.min(state.dragStart.y, state.dragCurrent.y);
            const bw = Math.abs(state.dragCurrent.x - state.dragStart.x);
            const bh = Math.abs(state.dragCurrent.y - state.dragStart.y);
            ctx.fillStyle = "rgba(47, 128, 237, 0.14)";
            ctx.strokeStyle = "#2F80ED";
            ctx.lineWidth = 1.2;
            ctx.setLineDash([4, 3]);
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeRect(bx, by, bw, bh);
            ctx.restore();
        }

        // Hover Tooltip Annotation (Exact match with #FFF8DC Matplotlib annotation)
        if (!targetCtx && state.hoverPoint) {
            drawHoverAnnotation(ctx, geom, state.hoverPoint);
        }

        ctx.restore();
    }

    function drawLegend(ctx, geom, seriesList) {
        ctx.save();
        ctx.font = "11px 'Malgun Gothic', sans-serif";
        const maxLegendItems = Math.min(seriesList.length, 12);
        let maxTextW = 0;
        for (let i = 0; i < maxLegendItems; i++) {
            const w = ctx.measureText(seriesList[i].col).width;
            if (w > maxTextW) maxTextW = w;
        }
        const lineLen = 22;
        const padX = 10;
        const padY = 8;
        const rowH = 18;
        const extraRows = seriesList.length > maxLegendItems ? 1 : 0;
        const boxW = lineLen + 8 + maxTextW + padX * 2;
        const boxH = (maxLegendItems + extraRows) * rowH + padY * 2 - 4;

        const boxX = geom.right - boxW - 10;
        const boxY = geom.top + 10;

        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.strokeStyle = "#CBD5E1";
        ctx.lineWidth = 1;
        roundRect(ctx, boxX, boxY, boxW, boxH, 4, true, true);

        for (let i = 0; i < maxLegendItems; i++) {
            const item = seriesList[i];
            const yCenter = boxY + padY + i * rowH + 6;

            ctx.strokeStyle = item.color;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(boxX + padX, yCenter);
            ctx.lineTo(boxX + padX + lineLen, yCenter);
            ctx.stroke();

            ctx.fillStyle = "#1F2933";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(item.col, boxX + padX + lineLen + 8, yCenter);
        }

        if (extraRows > 0) {
            const yCenter = boxY + padY + maxLegendItems * rowH + 6;
            ctx.fillStyle = "#64748B";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(`... +${seriesList.length - maxLegendItems} more`, boxX + padX, yCenter);
        }
        ctx.restore();
    }

    function drawHoverAnnotation(ctx, geom, hp) {
        ctx.save();
        // Highlight marker on line
        ctx.fillStyle = hp.color;
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(hp.screenX, hp.screenY, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        const lines = [
            hp.col,
            `x=${formatHoverX(hp.xVal)}`,
            `y=${hp.yVal.toFixed(4)}`
        ];

        ctx.font = "11.5px Consolas, 'Malgun Gothic', monospace";
        let maxW = 0;
        for (const l of lines) {
            const w = ctx.measureText(l).width;
            if (w > maxW) maxW = w;
        }
        const padX = 9;
        const padY = 7;
        const lineH = 16;
        const boxW = maxW + padX * 2;
        const boxH = lines.length * lineH + padY * 2 - 2;

        let boxX = hp.screenX + 14;
        let boxY = hp.screenY - boxH - 12;
        if (boxX + boxW > geom.right - 4) {
            boxX = hp.screenX - boxW - 14;
        }
        if (boxY < geom.top + 4) {
            boxY = hp.screenY + 14;
        }

        // Arrow line to point
        ctx.strokeStyle = "#777777";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(boxX + boxW / 2, boxY + boxH / 2);
        ctx.lineTo(hp.screenX, hp.screenY);
        ctx.stroke();

        // Rounded box (#FFF8DC, border #777777)
        ctx.fillStyle = "rgba(255, 248, 220, 0.96)";
        ctx.strokeStyle = "#777777";
        ctx.lineWidth = 1;
        roundRect(ctx, boxX, boxY, boxW, boxH, 6, true, true);

        ctx.fillStyle = "#102A43";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        for (let i = 0; i < lines.length; i++) {
            ctx.fillText(lines[i], boxX + padX, boxY + padY + i * lineH);
        }
        ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    // -------------------------------------------------------------------------
    // 8. Mouse Hover, Zoom & Pan Interactions
    // -------------------------------------------------------------------------
    toolHome.addEventListener("click", () => {
        if (state.plotSeries.length === 0) return;
        state.xDomain = [...state.initialXDomain];
        state.yDomain = [...state.initialYDomain];
        renderCanvas();
    });

    toolZoom.addEventListener("click", () => {
        state.interactionMode = state.interactionMode === "zoom" ? null : "zoom";
        toolZoom.classList.toggle("active", state.interactionMode === "zoom");
        toolPan.classList.remove("active");
        plotCanvas.style.cursor = state.interactionMode === "zoom" ? "crosshair" : "default";
    });

    toolPan.addEventListener("click", () => {
        state.interactionMode = state.interactionMode === "pan" ? null : "pan";
        toolPan.classList.toggle("active", state.interactionMode === "pan");
        toolZoom.classList.remove("active");
        plotCanvas.style.cursor = state.interactionMode === "pan" ? "grab" : "default";
    });

    plotCanvas.addEventListener("mousedown", (e) => {
        if (state.plotSeries.length === 0 || !state.interactionMode) return;
        const rect = plotCanvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        state.dragStart = {
            x: mx,
            y: my,
            xDomain: [...state.xDomain],
            yDomain: [...state.yDomain]
        };
        state.dragCurrent = { x: mx, y: my };
    });

    plotCanvas.addEventListener("mousemove", (e) => {
        const rect = plotCanvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const geom = getPlotGeometry(rect.width, rect.height);

        // Handle Zoom / Pan Dragging
        if (state.dragStart && state.interactionMode === "pan") {
            const dx = mx - state.dragStart.x;
            const dy = my - state.dragStart.y;
            const xSpan = state.dragStart.xDomain[1] - state.dragStart.xDomain[0];
            const ySpan = state.dragStart.yDomain[1] - state.dragStart.yDomain[0];
            const xShift = -(dx / geom.plotWidth) * xSpan;
            const yShift = (dy / geom.plotHeight) * ySpan;
            state.xDomain = [state.dragStart.xDomain[0] + xShift, state.dragStart.xDomain[1] + xShift];
            state.yDomain = [state.dragStart.yDomain[0] + yShift, state.dragStart.yDomain[1] + yShift];
            renderCanvas();
            return;
        }

        if (state.dragStart && state.interactionMode === "zoom") {
            state.dragCurrent = { x: mx, y: my };
            renderCanvas();
            return;
        }

        // Hover Tooltip Calculation (Mirrors _on_mouse_move in PyQt5)
        if (
            state.plotSeries.length === 0 ||
            mx < geom.left || mx > geom.right ||
            my < geom.top || my > geom.bottom
        ) {
            toolbarCoords.textContent = "";
            if (state.hoverPoint !== null) {
                state.hoverPoint = null;
                renderCanvas();
            }
            return;
        }

        const [xMin, xMax] = state.xDomain;
        const [yMin, yMax] = state.yDomain;
        const mouseXVal = xMin + ((mx - geom.left) / geom.plotWidth) * (xMax - xMin);
        const mouseYVal = yMin + ((geom.bottom - my) / geom.plotHeight) * (yMax - yMin);

        toolbarCoords.textContent = `x=${formatHoverX(mouseXVal)}, y=${mouseYVal.toFixed(4)}`;

        let nearest = null;
        for (const series of state.plotSeries) {
            const pts = series.points;
            if (pts.length === 0) continue;

            // Binary search for closest X
            let lo = 0;
            let hi = pts.length - 1;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (pts[mid].x < mouseXVal) lo = mid + 1;
                else hi = mid;
            }
            let bestIdx = lo;
            if (lo > 0 && Math.abs(pts[lo - 1].x - mouseXVal) < Math.abs(pts[lo].x - mouseXVal)) {
                bestIdx = lo - 1;
            }

            const pt = pts[bestIdx];
            const px = geom.left + ((pt.x - xMin) / (xMax - xMin)) * geom.plotWidth;
            const py = geom.bottom - ((pt.y - yMin) / (yMax - yMin)) * geom.plotHeight;
            if (px < geom.left || px > geom.right || py < geom.top || py > geom.bottom) continue;

            const distPx = Math.hypot(px - mx, (py - my) * 0.65);
            if (!nearest || distPx < nearest.distPx) {
                nearest = {
                    distPx,
                    col: series.col,
                    color: series.color,
                    xVal: pt.x,
                    yVal: pt.y,
                    screenX: px,
                    screenY: py
                };
            }
        }

        state.hoverPoint = nearest;
        renderCanvas();
    });

    window.addEventListener("mouseup", () => {
        if (!state.dragStart) return;
        if (state.interactionMode === "zoom" && state.dragCurrent) {
            const rect = plotCanvas.getBoundingClientRect();
            const geom = getPlotGeometry(rect.width, rect.height);
            const x1 = Math.max(geom.left, Math.min(state.dragStart.x, state.dragCurrent.x));
            const x2 = Math.min(geom.right, Math.max(state.dragStart.x, state.dragCurrent.x));
            const y1 = Math.max(geom.top, Math.min(state.dragStart.y, state.dragCurrent.y));
            const y2 = Math.min(geom.bottom, Math.max(state.dragStart.y, state.dragCurrent.y));

            if (x2 - x1 > 8 && y2 - y1 > 8) {
                const [curXMin, curXMax] = state.xDomain;
                const [curYMin, curYMax] = state.yDomain;
                const newXMin = curXMin + ((x1 - geom.left) / geom.plotWidth) * (curXMax - curXMin);
                const newXMax = curXMin + ((x2 - geom.left) / geom.plotWidth) * (curXMax - curXMin);
                const newYMax = curYMin + ((geom.bottom - y1) / geom.plotHeight) * (curYMax - curYMin);
                const newYMin = curYMin + ((geom.bottom - y2) / geom.plotHeight) * (curYMax - curYMin);
                state.xDomain = [newXMin, newXMax];
                state.yDomain = [newYMin, newYMax];
            }
        }
        state.dragStart = null;
        state.dragCurrent = null;
        renderCanvas();
    });

    // Resize Observer for responsive canvas redrawing
    const resizeObserver = new ResizeObserver(() => {
        renderCanvas();
    });
    resizeObserver.observe(canvasContainer);

    // -------------------------------------------------------------------------
    // 9. Save Functions (CSV & High-Resolution 200 DPI JPG)
    // -------------------------------------------------------------------------
    btnSaveCsv.addEventListener("click", () => {
        if (!state.currentPlotDf || state.currentPlotDf.length === 0) {
            showMessageBox("저장할 데이터 없음", "먼저 그래프를 출력해 주세요.");
            return;
        }
        try {
            const baseName = (state.fileName || "selected_plot_data").replace(/\.[^/.]+$/, "");
            const defaultName = `${baseName}_selected_plot_data.csv`;

            // Columns matching _make_filtered_plot_dataframe in Python
            const exportCols = ["Time", "Time_dt"];
            if (!exportCols.includes(state.currentXCol)) {
                exportCols.push(state.currentXCol);
            }
            for (const y of state.currentYCols) {
                if (!exportCols.includes(y)) exportCols.push(y);
            }

            const csvLines = [exportCols.join(",")];
            for (let i = 0; i < state.currentPlotDf.length; i++) {
                const row = state.currentPlotDf[i];
                const cells = exportCols.map(c => {
                    if (c === "Time_dt") {
                        return formatTimeForSavedCsv(row.Time_dt);
                    }
                    const val = row[c];
                    if (val === undefined || val === null || Number.isNaN(val)) return "";
                    const str = String(val);
                    return str.includes(",") || str.includes('"') ? `"${str.replace(/"/g, '""')}"` : str;
                });
                csvLines.push(cells.join(","));
            }

            // UTF-8 with BOM (utf-8-sig)
            const bom = "\uFEFF";
            const blob = new Blob([bom + csvLines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
            triggerDownload(blob, defaultName);
        } catch (err) {
            showMessageBox("CSV 저장 오류", `CSV 파일 저장 중 오류가 발생했습니다.\n\n${err.message || err}`);
        }
    });

    btnSaveJpg.addEventListener("click", () => {
        if (!state.currentPlotDf || state.currentPlotDf.length === 0) {
            showMessageBox("저장할 그래프 없음", "먼저 그래프를 출력해 주세요.");
            return;
        }
        try {
            const baseName = (state.fileName || "selected_plot_graph").replace(/\.[^/.]+$/, "");
            const defaultName = `${baseName}_selected_plot_graph.jpg`;

            // Render onto an offscreen canvas at 200 DPI equivalent (figsize 12x6 -> 2400x1200)
            const offCanvas = document.createElement("canvas");
            const expW = 1200;
            const expH = 600;
            const scale = 2; // 2400 x 1200 px (200 DPI)
            offCanvas.width = expW * scale;
            offCanvas.height = expH * scale;
            const offCtx = offCanvas.getContext("2d");

            renderCanvas(offCtx, expW, expH, scale);

            offCanvas.toBlob((blob) => {
                if (!blob) return;
                triggerDownload(blob, defaultName);
            }, "image/jpeg", 0.95);
        } catch (err) {
            showMessageBox("JPG 저장 오류", `그래프 이미지 저장 중 오류가 발생했습니다.\n\n${err.message || err}`);
        }
    });

    function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // -------------------------------------------------------------------------
    // 10. Resizable Splitters (Horizontal & Vertical)
    // -------------------------------------------------------------------------
    const splitterV = document.getElementById("splitterV");
    const leftPanel = document.getElementById("leftPanel");
    let isDraggingV = false;

    splitterV.addEventListener("mousedown", () => {
        isDraggingV = true;
        document.body.style.cursor = "col-resize";
    });

    const splitterH = document.getElementById("splitterH");
    const rightPanel = document.getElementById("rightPanel");
    const graphPanel = document.getElementById("graphPanel");
    const analysisPanel = document.getElementById("analysisPanel");
    let isDraggingH = false;

    splitterH.addEventListener("mousedown", () => {
        isDraggingH = true;
        document.body.style.cursor = "row-resize";
    });

    window.addEventListener("mousemove", (e) => {
        if (isDraggingV) {
            const newW = Math.min(600, Math.max(260, e.clientX - 8));
            leftPanel.style.width = `${newW}px`;
            renderCanvas();
        }
        if (isDraggingH) {
            const rect = rightPanel.getBoundingClientRect();
            const relY = e.clientY - rect.top;
            const totalH = rect.height;
            const ratio = Math.min(0.82, Math.max(0.32, relY / totalH));
            graphPanel.style.flex = `${Math.round(ratio * 100)}`;
            analysisPanel.style.flex = `${Math.round((1 - ratio) * 100)}`;
            renderCanvas();
        }
    });

    window.addEventListener("mouseup", () => {
        if (isDraggingV || isDraggingH) {
            isDraggingV = false;
            isDraggingH = false;
            document.body.style.cursor = "default";
        }
    });

    // Initial render
    drawEmptyGraph();
})();
</script>
</body>
